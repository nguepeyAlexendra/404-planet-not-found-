name: ci
on:
  push: {branches: [main]}
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env: {POSTGRES_PASSWORD: ci, POSTGRES_DB: nisar}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    defaults: {run: {working-directory: backend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt}
      - run: pip install -r requirements.txt
      - name: Tests sur SQLite
        run: python -m pytest tests -q --cov=app
      - name: Migration puis tests sur PostgreSQL/PostGIS
        env:
          NV_DATABASE_URL: postgresql+psycopg://postgres:ci@localhost:5432/nisar
          NV_TEST_DATABASE_URL: postgresql+psycopg://postgres:ci@localhost:5432/nisar
          NV_USE_POSTGIS: "true"
        run: |
          alembic upgrade head
          alembic current
          python -m pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt}
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - name: API de démonstration
        working-directory: backend
        env: {NV_DATABASE_URL: "sqlite:////tmp/e2e.sqlite", NV_DATA_DIR: /tmp/e2e-data, NV_CORS_ORIGINS: "http://localhost:5173"}
        run: |
          pip install -r requirements.txt
          alembic upgrade head
          python -m app.cli seed-demo
          nohup uvicorn app.main:app --port 8000 > /tmp/api.log 2>&1 &
      - name: Front et tests navigateur
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          nohup npx vite --port 5173 > /tmp/vite.log 2>&1 &
          sleep 8
          npm run e2e
